<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <!-- Preload da foto de LCP da home. Ele é injetado aqui, e não como
         <link> fixo, porque só a home usa a imagem — nas outras rotas
         (painel, estoque, fichas) ela seria baixada à toa. As fotos
         ficam em public/ para manter a URL estável entre dev e build.
         CSP: este script inline é liberado por hash em vercel.json e
         public/_headers. Ele PRECISA ficar numa linha só: quebra de
         linha muda entre Windows (CRLF) e Linux (LF), e o hash deixaria
         de bater no deploy. Depois de qualquer mudança, rode
         `npm run csp` para recalcular e conferir o sha256. -->
    <script>if(location.pathname==='/'){var l=document.createElement('link');l.rel='preload';l.as='image';l.type='image/webp';l.href='/hero/moto-hero-inteira.webp';l.setAttribute('fetchpriority','high');document.head.appendChild(l)}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- PWA: app instalável (painel do dono). O manifest aponta
         start_url para /admin/login, então quem abre o app cai no
         login; o site no navegador segue abrindo no catálogo. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent + viewport-fit=cover: a página desenha por
         baixo da status bar (tela cheia, estilo app nativo). O iOS
         pinta os ícones da barra de branco; o fundo sob eles sai do
         --color-night-950 da bancada, que o <body> herda do CSS. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DG Motos" />
    <title>DG Motos — Seminovas inspecionadas em Belo Horizonte</title>
