<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <!-- Preload da foto de LCP da home. Ele é injetado aqui, e não como
         <link> fixo, porque só a home usa a imagem — nas outras rotas
         (painel, estoque, fichas) ela seria baixada à toa. As fotos
         ficam em public/ para manter a URL estável entre dev e build.
         CSP: este script inline é liberado por hash em vercel.json e
         public/_headers. Ele PRECISA ficar numa linha só: quebra de
         linha muda entre Windows (CRLF) e Linux (LF), e o hash deixaria
         de bater no deploy. Depois de qualquer mudança, rode
         `npm run csp` para recalcular e conferir o sha256. -->
    <script>if(location.pathname==='/'){var l=document.createElement('link');l.rel='preload';l.as='image';l.type='image/webp';l.href=matchMedia('(min-width: 1024px)').matches?'/hero/home-desktop.webp':'/hero/home-mobile-texto.webp';l.setAttribute('fetchpriority','high');document.head.appendChild(l)}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- PWA: app instalável (painel do dono). O manifest aponta
         start_url para /admin/login, então quem abre o app cai no
         login; o site no navegador segue abrindo no catálogo. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DG Motos" />
    <title>DG Motos — Seminovas inspecionadas em Belo Horizonte</title>
    <meta
      name="description"
      content="Loja de motocicletas seminovas em Belo Horizonte, MG. Inspeção mecânica e ciclística, laudo cautelar aprovado e negociação direta pelo WhatsApp."
    />
    <meta name="theme-color" content="#0a0a0b" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="DG Motos" />
    <meta property="og:title" content="DG Motos — Realizando Sonhos" />
    <meta property="og:url" content="https://dg-motos-bh.vercel.app/" />
    <meta property="og:image" content="https://dg-motos-bh.vercel.app/hero/showroom-2026-07-hd.webp" />
    <meta
      property="og:description"
      content="Loja de motocicletas seminovas em Belo Horizonte, MG. Inspeção mecânica e ciclística, laudo cautelar aprovado e negociação direta pelo WhatsApp."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Lato continua sendo a voz do site (texto, catálogo e celular).
      Archivo entra só no desktop editorial: títulos condensados de
      cartaz, com eixo de largura variável. As duas famílias têm
      papéis separados e não se misturam dentro de um mesmo bloco.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Lato:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
